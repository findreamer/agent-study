llm:
  provider: openai
  model: glm-5.3-flash # 模型名，需与 .env 的 OPENAI_BASE_URL 配套更换
  temperature: 0
  maxTokens: 16000 # 思考型模型需覆盖 思考+正文；汇总环节输入最重，推理可能吃掉上万 token
  timeoutMs: 300000         # 编排中分析/风控并行，网关排队时实际耗时≈两者之和，需放宽

retrieval:
  enabled: true
  topK: 3

tools:
  enableConstraintCheck: true
  enableEntityLookup: true

features:
  enableStructuredOutput: true
  enableStreaming: true
