llm:
  provider: openai
  model: glm-4-flash        # 模型名，需与 .env 的 OPENAI_BASE_URL 配套更换
  temperature: 0
  maxTokens: 800
  timeoutMs: 30000

retrieval:
  enabled: true
  topK: 3

tools:
  enableConstraintCheck: true
  enableEntityLookup: true

features:
  enableStructuredOutput: true
  enableStreaming: true
