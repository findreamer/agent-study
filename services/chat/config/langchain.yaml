llm:
  provider: openai
  model: glm-5.3-flash # 模型名，需与 .env 的 OPENAI_BASE_URL 配套更换
  temperature: 0
  maxTokens: 4000 # 思考型模型（ark-code-latest）需要覆盖 思考+正文 的预算
  timeoutMs: 60000          # 思考型模型首轮开放式提问可能超 30s，放宽到 60s

retrieval:
  enabled: true
  topK: 3

tools:
  enableConstraintCheck: true
  enableEntityLookup: true

features:
  enableStructuredOutput: true
  enableStreaming: true
