llm:
  provider: openai
  model: glm-5.3-flash # 模型名，需与 .env 的 OPENAI_BASE_URL 配套更换
  temperature: 0
  maxTokens: 8000 # 思考型模型需要覆盖 思考+正文 的预算；汇总 Agent 输入长、推理多，4000 会被推理耗尽
  timeoutMs: 120000         # 多 Agent 编排中汇总环节要吃进分析+风控长文，60s 会超时

retrieval:
  enabled: true
  topK: 3

tools:
  enableConstraintCheck: true
  enableEntityLookup: true

features:
  enableStructuredOutput: true
  enableStreaming: true
