services:
  chat:
    command: bun run dev
    volumes:
      - ../../services/chat/src:/app/services/chat/src
      - ../../packages/contracts:/app/packages/contracts

  chat-web:
    command: bun run dev
    volumes:
      - ../../clients/chat-web/src:/app/clients/chat-web
      - ../../packages/contracts:/app/packages/contracts

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_study
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_study"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: {}
